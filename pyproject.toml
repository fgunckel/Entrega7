[project]
name = "architecture-decision-assistant"
version = "0.1.0"
description = "Multi-agent architecture decision assistant built with LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6,<2.0",
    "langchain-core>=0.3,<2.0",
    "langchain-groq>=0.3,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "redis>=5.0,<6.0",
    "langgraph-checkpoint-redis>=0.5,<1.0",
    "openinference-instrumentation-langchain>=0.1,<1.0",
    "opentelemetry-sdk>=1.25,<3.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
    "fakeredis>=2.30,<3.0",
    "pyparsing>=3.3.3",
]

retrieval = [
    "rank-bm25>=0.2.2,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "numpy>=1.26,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ada"]
